<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5; color: #1e293b; height: 100vh; overflow: hidden;
        }
        .app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; }

        header {
            padding: 14px 20px; background: #fff; border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; gap: 12px; flex-shrink: 0;
        }
        header h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
        .config-btn {
            background: none; border: 1px solid #d1d5db; border-radius: 8px;
            padding: 6px 12px; font-size: 0.8rem; cursor: pointer; color: #475569;
        }
        .config-btn:hover { background: #f8fafc; }

        #messages {
            flex: 1; overflow-y: auto; padding: 20px; display: flex;
            flex-direction: column; gap: 16px; scroll-behavior: smooth;
        }
        .msg { display: flex; gap: 12px; max-width: 85%; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.ai { align-self: flex-start; }
        .avatar {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 600;
        }
        .msg.user .avatar { background: #3b82f6; color: #fff; }
        .msg.ai .avatar { background: #fff; color: #374151; border: 1px solid #e2e8f0; }
        .bubble {
            padding: 12px 16px; border-radius: 18px; font-size: 0.95rem;
            line-height: 1.6; white-space: pre-wrap; word-break: break-word;
        }
        .msg.user .bubble { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
        .msg.ai .bubble { background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }

        .msg.ai .bubble p { margin-bottom: 8px; }
        .msg.ai .bubble p:last-child { margin-bottom: 0; }
        .msg.ai .bubble code {
            background: #f1f5f9; padding: 1px 5px; border-radius: 4px;
            font-size: 0.85em; font-family: 'SF Mono', Consolas, monospace;
        }
        .msg.ai .bubble pre {
            background: #1e1e24; color: #abb2bf; padding: 12px 16px;
            border-radius: 10px; overflow-x: auto; margin: 8px 0;
            font-size: 0.85rem; font-family: 'SF Mono', Consolas, monospace;
        }

        .thinking {
            padding: 10px 14px; background: #f8fafc; border-left: 3px solid #94a3b8;
            border-radius: 8px; font-size: 0.85rem; color: #64748b; margin-bottom: 8px;
            font-style: italic;
        }

        .input-area {
            padding: 16px 20px; background: #fff; border-top: 1px solid #e2e8f0;
            display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
        }
        #input {
            flex: 1; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 24px;
            outline: none; font-size: 0.95rem; resize: none; max-height: 150px;
            font-family: inherit; line-height: 1.5;
        }
        #input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

        #sendBtn {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: #3b82f6; color: #fff; cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s; flex-shrink: 0;
        }
        #sendBtn:hover { background: #2563eb; }
        #sendBtn:disabled { background: #93c5fd; cursor: not-allowed; }

        .typing .bubble::after {
            content: '...'; animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

        .config-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            align-items: center; justify-content: center; z-index: 9999;
        }
        .config-modal.show { display: flex; }
        .config-panel {
            background: #fff; border-radius: 20px; padding: 28px; width: 90%;
            max-width: 460px; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .config-panel h2 { font-size: 1.2rem; margin-bottom: 20px; }
        .config-panel label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px; color: #374151; }
        .config-panel input, .config-panel select {
            width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
            border-radius: 10px; font-size: 0.9rem; margin-bottom: 14px; outline: none;
        }
        .config-panel input:focus { border-color: #3b82f6; }
        .hint {
            font-size: 0.8rem; color: #6b7280; margin: -10px 0 14px 2px;
            line-height: 1.5;
        }
        .hint code {
            background: #f1f5f9; padding: 1px 5px; border-radius: 4px;
            font-family: 'SF Mono', Consolas, monospace; font-size: 0.85em;
        }
        .config-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
        .config-actions button {
            padding: 10px 20px; border-radius: 40px; border: none; font-weight: 500;
            cursor: pointer; font-size: 0.9rem;
        }
        .config-actions .save { background: #0f172a; color: #fff; }
        .config-actions .save:hover { background: #1e293b; }
        .config-actions .cancel { background: #e2e8f0; color: #475569; }
        .config-actions .cancel:hover { background: #cbd5e1; }

        .empty-state {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #94a3b8; font-size: 0.95rem; text-align: center; line-height: 2;
        }

        @media (max-width: 600px) {
            .msg { max-width: 95%; }
            .config-panel { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>💬 AI Chat</h1>
        <button class="config-btn" onclick="showConfig()">⚙️ 设置</button>
    </header>
    <div id="messages">
        <div class="empty-state">
            👋 你好！开始聊天吧<br>
            点击右上角 ⚙️ 设置 API
        </div>
    </div>
    <div class="input-area">
        <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="onKey(event)"></textarea>
        <button id="sendBtn" onclick="send()">➤</button>
    </div>
</div>

<div class="config-modal" id="configModal">
    <div class="config-panel">
        <h2>⚙️ 设置</h2>
        <label>API 地址</label>
        <input id="cfgUrl" value="https://zen.l.moonchan.xyz/v1/chat/completions" placeholder="https://api.deepseek.com/v1/chat/completions">
        <div class="hint">可使用 ech-proxy 的 <code>zen.l.moonchan.xyz</code> 作为默认后端转发</div>
        <label>API Key</label>
        <input id="cfgKey" type="password" placeholder="sk-...">
        <label>模型</label>
        <select id="cfgModel">
            <option value="deepseek-v4-flash-free" selected>deepseek-v4-flash-free</option>
        </select>
        <input id="cfgModelCustom" placeholder="或者输入自定义模型名" style="margin-top:-4px">
        <label>System Prompt</label>
        <input id="cfgSystem" placeholder="可选，AI 角色设定">
        <div class="config-actions">
            <button class="save" onclick="saveConfig()">保存</button>
            <button class="cancel" onclick="hideConfig()">取消</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'aichat_config';
    let config = loadConfig();
    let messages = [{ role: 'system', content: config.system }];
    let loading = false;

    function loadConfig() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) return JSON.parse(saved);
        } catch {}
        return { url: 'https://zen.l.moonchan.xyz/v1/chat/completions', key: '', model: 'deepseek-v4-flash-free', system: '' };
    }

    function saveConfig() {
        config.url = document.getElementById('cfgUrl').value.trim();
        config.key = document.getElementById('cfgKey').value.trim();
        const custom = document.getElementById('cfgModelCustom').value.trim();
        config.model = custom || document.getElementById('cfgModel').value;
        config.system = document.getElementById('cfgSystem').value.trim();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        messages = [{ role: 'system', content: config.system }];
        document.getElementById('messages').innerHTML = '<div class="empty-state">👋 设置已保存<br>开始聊天吧</div>';
        hideConfig();
    }

    function showConfig() {
        document.getElementById('cfgUrl').value = config.url;
        document.getElementById('cfgKey').value = config.key;
        const inFree = ['deepseek-v4-flash-free', ''].includes(config.model);
        document.getElementById('cfgModel').value = inFree ? 'deepseek-v4-flash-free' : 'deepseek-v4-flash-free';
        document.getElementById('cfgModelCustom').value = inFree ? '' : config.model;
        document.getElementById('cfgSystem').value = config.system;
        document.getElementById('configModal').classList.add('show');
    }

    function hideConfig() {
        document.getElementById('configModal').classList.remove('show');
    }

    function addMsg(role, text, thinking) {
        const container = document.getElementById('messages');
        const empty = container.querySelector('.empty-state');
        if (empty) empty.remove();

        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = `<div class="avatar">${role === 'user' ? 'U' : 'AI'}</div><div class="bubble">`;
        const bubble = div.querySelector('.bubble');

        if (role === 'ai' && thinking) {
            const t = document.createElement('div');
            t.className = 'thinking';
            t.textContent = thinking;
            bubble.prepend(t);
        }

        if (role === 'ai') {
            bubble.innerHTML += marked(text || '');
        } else {
            bubble.textContent = text;
        }

        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    function updateBubble(el, text, thinking) {
        const bubble = el.querySelector('.bubble');
        bubble.innerHTML = '';
        if (thinking) {
            const t = document.createElement('div');
            t.className = 'thinking';
            t.textContent = thinking;
            bubble.appendChild(t);
        }
        bubble.innerHTML += marked(text || '');
    }

    async function send() {
        const input = document.getElementById('input');
        const text = input.value.trim();
        if (!text || loading) return;

        if (!config.key) {
            showConfig();
            return;
        }

        input.value = '';
        input.style.height = 'auto';
        addMsg('user', text);
        messages.push({ role: 'user', content: text });

        loading = true;
        document.getElementById('sendBtn').disabled = true;

        const msgDiv = addMsg('ai', '...');
        msgDiv.classList.add('typing');

        let fullContent = '';
        let fullReasoning = '';

        try {
            const body = {
                model: config.model,
                messages: messages,
                stream: true,
                max_tokens: 8192
            };
            if (config.model.includes('reasoner') || config.model.includes('deepseek-v4')) {
                body.enable_thinking = true;
            }

            const resp = await fetch(config.url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.key}`
                },
                body: JSON.stringify(body)
            });

            if (!resp.ok) {
                const err = await resp.text();
                throw new Error(`HTTP ${resp.status}: ${err}`);
            }

            msgDiv.classList.remove('typing');
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || !trimmed.startsWith('data: ')) continue;
                    const data = trimmed.slice(6).trim();
                    if (data === '[DONE]') continue;
                    try {
                        const json = JSON.parse(data);
                        const choices = json.choices;
                        if (!choices || !choices.length) continue;
                        const delta = choices[0].delta;
                        if (delta.reasoning_content) {
                            fullReasoning += delta.reasoning_content;
                        }
                        if (delta.content) {
                            fullContent += delta.content;
                        }
                        updateBubble(msgDiv, fullContent, fullReasoning || null);
                    } catch {}
                }
            }

            if (buffer.trim()) {
                const data = buffer.trim().slice(6).trim();
                if (data !== '[DONE]') {
                    try {
                        const json = JSON.parse(data);
                        const delta = json.choices?.[0]?.delta;
                        if (delta?.reasoning_content) fullReasoning += delta.reasoning_content;
                        if (delta?.content) fullContent += delta.content;
                        updateBubble(msgDiv, fullContent, fullReasoning || null);
                    } catch {}
                }
            }

            messages.push({ role: 'assistant', content: fullContent, reasoning_content: fullReasoning || undefined });

        } catch (e) {
            msgDiv.classList.remove('typing');
            const bubble = msgDiv.querySelector('.bubble');
            bubble.innerHTML = `<span style="color:#dc2626">❌ ${e.message}</span>`;
        }

        loading = false;
        document.getElementById('sendBtn').disabled = false;
    }

    function onKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    }

    document.getElementById('input').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });

    document.getElementById('configModal').addEventListener('click', function(e) {
        if (e.target === this) hideConfig();
    });

    function marked(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');
    }
</script>
</body>
</html>
