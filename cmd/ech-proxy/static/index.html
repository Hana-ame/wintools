<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5; color: #1e293b; height: 100vh; overflow: hidden;
        }
        .app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; }

        header {
            padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e8f0;
            display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap;
        }
        header h1 { font-size: 1rem; font-weight: 600; margin-right: auto; }
        .hdr-btn {
            background: none; border: 1px solid #d1d5db; border-radius: 8px;
            padding: 4px 10px; font-size: 0.75rem; cursor: pointer; color: #475569;
            white-space: nowrap;
        }
        .hdr-btn:hover { background: #f8fafc; }
        .hdr-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #statBar {
            padding: 4px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;
            font-size: 0.72rem; color: #64748b; display: flex; gap: 16px;
            flex-shrink: 0; flex-wrap: wrap;
        }

        #messages {
            flex: 1; overflow-y: auto; padding: 16px 20px; display: flex;
            flex-direction: column; gap: 12px; scroll-behavior: smooth;
        }
        .msg { display: flex; gap: 10px; max-width: 88%; position: relative; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.ai { align-self: flex-start; }
        .msg .msg-actions {
            position: absolute; top: 0; right: 100%; display: none; gap: 2px;
            padding-right: 4px;
        }
        .msg.user .msg-actions { right: auto; left: 100%; padding: 0 0 0 4px; }
        .msg:hover .msg-actions { display: flex; }
        .msg .msg-actions button {
            background: #fff; border: 1px solid #d1d5db; border-radius: 6px;
            padding: 2px 6px; font-size: 0.65rem; cursor: pointer; color: #64748b;
            white-space: nowrap;
        }
        .msg .msg-actions button:hover { background: #f1f5f9; }
        .avatar {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 600;
        }
        .msg.user .avatar { background: #3b82f6; color: #fff; }
        .msg.ai .avatar { background: #fff; color: #374151; border: 1px solid #e2e8f0; }
        .bubble {
            padding: 10px 14px; border-radius: 16px; font-size: 0.92rem;
            line-height: 1.6; white-space: pre-wrap; word-break: break-word;
            min-width: 40px;
        }
        .msg.user .bubble { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
        .msg.ai .bubble { background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }

        .msg.ai .bubble p { margin-bottom: 6px; }
        .msg.ai .bubble p:last-child { margin-bottom: 0; }
        .msg.ai .bubble code {
            background: #f1f5f9; padding: 1px 5px; border-radius: 4px;
            font-size: 0.85em; font-family: 'SF Mono', Consolas, monospace;
        }
        .msg.ai .bubble pre {
            background: #1e1e24; color: #abb2bf; padding: 10px 14px;
            border-radius: 10px; overflow-x: auto; margin: 6px 0;
            font-size: 0.82rem; font-family: 'SF Mono', Consolas, monospace;
        }

        .thinking {
            padding: 8px 12px; background: #f8fafc; border-left: 3px solid #94a3b8;
            border-radius: 8px; font-size: 0.82rem; color: #64748b; margin-bottom: 6px;
            font-style: italic;
        }

        .msg.editing .bubble { padding: 4px; }
        .msg.editing textarea {
            width: 100%; border: 2px solid #3b82f6; border-radius: 12px;
            padding: 8px 10px; font-size: 0.9rem; font-family: inherit;
            resize: vertical; outline: none; min-height: 60px;
        }

        .input-area {
            padding: 12px 16px; background: #fff; border-top: 1px solid #e2e8f0;
            display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
        }
        #input {
            flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 24px;
            outline: none; font-size: 0.92rem; resize: none; max-height: 120px;
            font-family: inherit; line-height: 1.5;
        }
        #input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        #sendBtn {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: #3b82f6; color: #fff; cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s; flex-shrink: 0;
        }
        #sendBtn:hover { background: #2563eb; }
        #sendBtn:disabled { background: #93c5fd; cursor: not-allowed; }

        .typing .bubble::after { content: '...'; animation: dots 1.5s steps(4,end) infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            align-items: center; justify-content: center; z-index: 9999;
            padding: 16px;
        }
        .modal.show { display: flex; }
        .modal-panel {
            background: #fff; border-radius: 20px; padding: 24px; width: 100%;
            max-width: 520px; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .modal-panel h2 { font-size: 1.1rem; margin-bottom: 16px; }
        .modal-panel label { font-size: 0.82rem; font-weight: 600; display: block; margin-bottom: 3px; color: #374151; }
        .modal-panel input, .modal-panel select, .modal-panel textarea {
            width: 100%; padding: 8px 10px; border: 1px solid #d1d5db;
            border-radius: 10px; font-size: 0.88rem; margin-bottom: 10px; outline: none;
            font-family: inherit;
        }
        .modal-panel input:focus { border-color: #3b82f6; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
        .modal-actions button {
            padding: 8px 18px; border-radius: 40px; border: none; font-weight: 500;
            cursor: pointer; font-size: 0.85rem;
        }
        .modal-actions .primary { background: #0f172a; color: #fff; }
        .modal-actions .primary:hover { background: #1e293b; }
        .modal-actions .secondary { background: #e2e8f0; color: #475569; }
        .modal-actions .secondary:hover { background: #cbd5e1; }
        .modal-actions .danger { background: #fee2e2; color: #dc2626; }
        .modal-actions .danger:hover { background: #fecaca; }

        .conv-list { max-height: 50vh; overflow-y: auto; }
        .conv-item {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
        }
        .conv-item:hover { background: #f8fafc; border-radius: 8px; }
        .conv-item .conv-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.85rem; }
        .conv-item .conv-meta { font-size: 0.7rem; color: #94a3b8; white-space: nowrap; }
        .conv-item .conv-del {
            background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 0.9rem; padding: 2px 4px;
        }
        .conv-item .conv-del:hover { color: #dc2626; }

        .empty-state {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #94a3b8; font-size: 0.9rem; text-align: center; line-height: 2;
        }

        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: #fff; padding: 8px 18px; border-radius: 40px;
            font-size: 0.82rem; z-index: 99999; opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        .params-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .params-grid .full { grid-column: 1 / -1; }

        @media (max-width: 600px) {
            .msg { max-width: 95%; }
            .modal-panel { padding: 16px; }
            .params-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>💬 AI Chat</h1>
        <button class="hdr-btn" onclick="showConvList()" title="对话历史">📋 历史</button>
        <button class="hdr-btn" onclick="copyMessages()" title="复制 messages[]">📋 复制</button>
        <button class="hdr-btn" onclick="showParams()" title="请求参数">⚙️ 参数</button>
        <button class="hdr-btn" onclick="newChat()" title="新对话">➕ 新</button>
        <button class="hdr-btn" onclick="showConfig()">🔑 设置</button>
    </header>
    <div id="statBar">
        <span id="statMsgs">消息: 0</span>
        <span id="statChars">字符: 0</span>
        <span id="statTokens">预估 Token: 0</span>
    </div>
    <div id="messages">
        <div class="empty-state">
            👋 你好！开始聊天吧<br>
            点击右上角 🔑 设置 API
        </div>
    </div>
    <div class="input-area">
        <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="onKey(event)"></textarea>
        <button id="sendBtn" onclick="send()">➤</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="configModal">
    <div class="modal-panel">
        <h2>🔑 设置</h2>
        <label>API 地址</label>
        <input id="cfgUrl" value="https://zen.l.moonchan.xyz/v1/chat/completions" placeholder="https://api.deepseek.com/v1/chat/completions">
        <div class="hint" style="font-size:0.78rem;color:#6b7280;margin:-6px 0 10px 2px;">可使用 ech-proxy 的 <code style="background:#f1f5f9;padding:1px 5px;border-radius:4px;font-family:monospace;">zen.l.moonchan.xyz</code> 作为默认后端转发</div>
        <label>API Key</label>
        <input id="cfgKey" type="password" placeholder="sk-...">
        <label>模型</label>
        <select id="cfgModel">
            <option value="deepseek-v4-flash-free" selected>deepseek-v4-flash-free</option>
        </select>
        <input id="cfgModelCustom" placeholder="或者输入自定义模型名" style="margin-top:-6px;font-size:0.82rem;">
        <label>System Prompt</label>
        <input id="cfgSystem" placeholder="可选，AI 角色设定">
        <div class="modal-actions">
            <button class="primary" onclick="saveConfig()">保存</button>
            <button class="secondary" onclick="hideModal('configModal')">取消</button>
        </div>
    </div>
</div>

<div class="modal" id="paramsModal">
    <div class="modal-panel">
        <h2>⚙️ 请求参数</h2>
        <div class="params-grid">
            <div>
                <label>max_tokens</label>
                <input id="pMaxTokens" type="number" value="8192" min="1" max="131072">
            </div>
            <div>
                <label>temperature</label>
                <input id="pTemperature" type="number" value="0" step="0.1" min="0" max="2" placeholder="默认">
            </div>
            <div>
                <label>top_p</label>
                <input id="pTopP" type="number" value="0" step="0.05" min="0" max="1" placeholder="默认">
            </div>
            <div>
                <label>enable_thinking</label>
                <select id="pThinking">
                    <option value="">自动</option>
                    <option value="true">开启</option>
                    <option value="false">关闭</option>
                </select>
            </div>
            <div class="full">
                <label>额外字段 (JSON)</label>
                <textarea id="pExtra" rows="2" placeholder='{"stop":["\n"],"frequency_penalty":0}' style="font-family:monospace;font-size:0.82rem;"></textarea>
            </div>
        </div>
        <div class="modal-actions">
            <button class="primary" onclick="saveParams()">保存</button>
            <button class="secondary" onclick="resetParams()">重置</button>
            <button class="secondary" onclick="hideModal('paramsModal')">取消</button>
        </div>
    </div>
</div>

<div class="modal" id="convModal">
    <div class="modal-panel">
        <h2>📋 对话历史</h2>
        <div class="conv-list" id="convList"></div>
        <div class="modal-actions">
            <button class="secondary" onclick="hideModal('convModal')">关闭</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'aichat_config';
    const PARAMS_KEY = 'aichat_params';
    const CONV_KEY = 'aichat_conversations';
    const CUR_KEY = 'aichat_current';

    let config = loadConfig();
    let params = loadParams();
    let messages = [{ role: 'system', content: config.system }];
    let loading = false;
    let currentConvId = null;

    function loadConfig() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) return JSON.parse(saved);
        } catch {}
        return { url: 'https://zen.l.moonchan.xyz/v1/chat/completions', key: '', model: 'deepseek-v4-flash-free', system: '' };
    }

    function saveConfig() {
        config.url = document.getElementById('cfgUrl').value.trim();
        config.key = document.getElementById('cfgKey').value.trim();
        const custom = document.getElementById('cfgModelCustom').value.trim();
        config.model = custom || document.getElementById('cfgModel').value;
        config.system = document.getElementById('cfgSystem').value.trim();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        if (messages[0] && messages[0].role === 'system') {
            messages[0].content = config.system;
        } else {
            messages.unshift({ role: 'system', content: config.system });
        }
        hideModal('configModal');
        toast('设置已保存');
    }

    function showConfig() {
        document.getElementById('cfgUrl').value = config.url;
        document.getElementById('cfgKey').value = config.key;
        const inFree = ['deepseek-v4-flash-free', ''].includes(config.model);
        document.getElementById('cfgModel').value = 'deepseek-v4-flash-free';
        document.getElementById('cfgModelCustom').value = inFree ? '' : config.model;
        document.getElementById('cfgSystem').value = config.system;
        showModal('configModal');
    }

    function loadParams() {
        try {
            const saved = localStorage.getItem(PARAMS_KEY);
            if (saved) return JSON.parse(saved);
        } catch {}
        return { max_tokens: 8192, temperature: 0, top_p: 0, thinking: '', extra: '' };
    }

    function saveParams() {
        params.max_tokens = parseInt(document.getElementById('pMaxTokens').value) || 8192;
        params.temperature = parseFloat(document.getElementById('pTemperature').value) || 0;
        params.top_p = parseFloat(document.getElementById('pTopP').value) || 0;
        params.thinking = document.getElementById('pThinking').value;
        params.extra = document.getElementById('pExtra').value.trim();
        localStorage.setItem(PARAMS_KEY, JSON.stringify(params));
        hideModal('paramsModal');
        toast('参数已保存');
    }

    function resetParams() {
        params = { max_tokens: 8192, temperature: 0, top_p: 0, thinking: '', extra: '' };
        localStorage.setItem(PARAMS_KEY, JSON.stringify(params));
        document.getElementById('pMaxTokens').value = params.max_tokens;
        document.getElementById('pTemperature').value = params.temperature;
        document.getElementById('pTopP').value = params.top_p;
        document.getElementById('pThinking').value = params.thinking;
        document.getElementById('pExtra').value = params.extra;
        toast('参数已重置');
    }

    function showParams() {
        document.getElementById('pMaxTokens').value = params.max_tokens;
        document.getElementById('pTemperature').value = params.temperature;
        document.getElementById('pTopP').value = params.top_p;
        document.getElementById('pThinking').value = params.thinking;
        document.getElementById('pExtra').value = params.extra;
        showModal('paramsModal');
    }

    function showModal(id) { document.getElementById(id).classList.add('show'); }
    function hideModal(id) { document.getElementById(id).classList.remove('show'); }
    document.querySelectorAll('.modal').forEach(m => {
        m.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });
    });

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2000);
    }

    function addMsg(role, text, thinking) {
        const container = document.getElementById('messages');
        const empty = container.querySelector('.empty-state');
        if (empty) empty.remove();

        const div = document.createElement('div');
        div.className = `msg ${role}`;
        const idx = messages.length - 1;
        div.dataset.idx = idx;

        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        if (role === 'user') {
            actions.innerHTML = '<button onclick="editMsg(this)">✏️</button><button onclick="deleteMsg(this)">🗑️</button>';
        } else if (role === 'ai') {
            actions.innerHTML = '<button onclick="deleteMsg(this)">🗑️</button>';
        }
        div.appendChild(actions);

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? 'U' : 'AI';
        div.appendChild(avatar);

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'ai' && thinking) {
            const t = document.createElement('div');
            t.className = 'thinking';
            t.textContent = thinking;
            bubble.appendChild(t);
        }
        if (role === 'ai') {
            bubble.innerHTML += marked(text || '');
        } else {
            bubble.textContent = text;
        }
        div.appendChild(bubble);

        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        updateStats();
        return div;
    }

    function updateBubble(el, text, thinking) {
        const bubble = el.querySelector('.bubble');
        bubble.innerHTML = '';
        if (thinking) {
            const t = document.createElement('div');
            t.className = 'thinking';
            t.textContent = thinking;
            bubble.appendChild(t);
        }
        bubble.innerHTML += marked(text || '');
    }

    function editMsg(btn) {
        const msgDiv = btn.closest('.msg');
        const bubble = msgDiv.querySelector('.bubble');
        const idx = parseInt(msgDiv.dataset.idx);
        if (isNaN(idx)) return;

        if (msgDiv.classList.contains('editing')) return;

        const originalText = messages[idx].content;
        msgDiv.classList.add('editing');
        bubble.innerHTML = '';

        const ta = document.createElement('textarea');
        ta.value = originalText;
        bubble.appendChild(ta);
        ta.focus();

        const saveBtn = document.createElement('button');
        saveBtn.textContent = '保存';
        saveBtn.style.cssText = 'margin-top:6px;padding:6px 16px;background:#0f172a;color:#fff;border:none;border-radius:40px;cursor:pointer;font-size:0.8rem;';
        bubble.appendChild(saveBtn);

        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = '取消';
        cancelBtn.style.cssText = 'margin-top:6px;margin-left:6px;padding:6px 16px;background:#e2e8f0;color:#475569;border:none;border-radius:40px;cursor:pointer;font-size:0.8rem;';
        bubble.appendChild(cancelBtn);

        const done = (save) => {
            if (save) {
                const newText = ta.value.trim();
                if (newText && newText !== originalText) {
                    messages[idx] = { ...messages[idx], content: newText };
                }
            }
            msgDiv.classList.remove('editing');
            const role = messages[idx].role;
            if (role === 'ai') {
                const t = messages[idx].reasoning_content;
                updateBubble(msgDiv, messages[idx].content, t || null);
            } else {
                bubble.textContent = messages[idx].content;
            }
            updateStats();
        };

        saveBtn.onclick = () => done(true);
        cancelBtn.onclick = () => done(false);
        ta.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); done(true); }
            if (e.key === 'Escape') { done(false); }
        });
    }

    function deleteMsg(btn) {
        const msgDiv = btn.closest('.msg');
        const idx = parseInt(msgDiv.dataset.idx);
        if (isNaN(idx) || idx < 1) return;
        if (!confirm('删除此消息及后续所有消息？')) return;

        messages.splice(idx);
        msgDiv.parentElement.querySelectorAll('.msg').forEach(el => {
            const i = parseInt(el.dataset.idx);
            if (!isNaN(i) && i >= idx) el.remove();
        });
        updateStats();
        if (messages.length <= 1) {
            document.getElementById('messages').innerHTML = '<div class="empty-state">💬 消息已清空，开始新对话</div>';
        }
    }

    function updateStats() {
        const nonSys = messages.filter(m => m.role !== 'system');
        const chars = nonSys.reduce((s, m) => s + (m.content || '').length + (m.reasoning_content || '').length, 0);
        document.getElementById('statMsgs').textContent = `消息: ${nonSys.length}`;
        document.getElementById('statChars').textContent = `字符: ${chars}`;
        document.getElementById('statTokens').textContent = `预估 Token: ${Math.ceil(chars / 3.5)}`;
    }

    function buildRequestBody() {
        const body = {
            model: config.model,
            messages: messages,
            stream: true,
        };
        if (params.max_tokens) body.max_tokens = params.max_tokens;
        if (params.temperature) body.temperature = params.temperature;
        if (params.top_p) body.top_p = params.top_p;
        if (params.thinking === 'true') body.enable_thinking = true;
        else if (params.thinking === 'false') body.enable_thinking = false;
        else if (config.model.includes('reasoner') || config.model.includes('deepseek-v4')) {
            body.enable_thinking = true;
        }
        if (params.extra) {
            try {
                const extra = JSON.parse(params.extra);
                Object.assign(body, extra);
            } catch {}
        }
        return body;
    }

    async function send() {
        const input = document.getElementById('input');
        const text = input.value.trim();
        if (!text || loading) return;

        if (!config.key) { showConfig(); return; }

        input.value = '';
        input.style.height = 'auto';
        addMsg('user', text);
        messages.push({ role: 'user', content: text });
        loading = true;
        document.getElementById('sendBtn').disabled = true;

        const msgDiv = addMsg('ai', '...');
        msgDiv.classList.add('typing');
        let fullContent = '';
        let fullReasoning = '';

        try {
            const body = buildRequestBody();
            const resp = await fetch(config.url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.key}`
                },
                body: JSON.stringify(body)
            });

            if (!resp.ok) {
                const err = await resp.text();
                throw new Error(`HTTP ${resp.status}: ${err}`);
            }

            msgDiv.classList.remove('typing');
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || !trimmed.startsWith('data: ')) continue;
                    const data = trimmed.slice(6).trim();
                    if (data === '[DONE]') continue;
                    try {
                        const json = JSON.parse(data);
                        const choices = json.choices;
                        if (!choices || !choices.length) continue;
                        const delta = choices[0].delta;
                        if (delta.reasoning_content) fullReasoning += delta.reasoning_content;
                        if (delta.content) fullContent += delta.content;
                        updateBubble(msgDiv, fullContent, fullReasoning || null);
                    } catch {}
                }
            }

            if (buffer.trim()) {
                const data = buffer.trim().slice(6).trim();
                if (data !== '[DONE]') {
                    try {
                        const json = JSON.parse(data);
                        const delta = json.choices?.[0]?.delta;
                        if (delta?.reasoning_content) fullReasoning += delta.reasoning_content;
                        if (delta?.content) fullContent += delta.content;
                        updateBubble(msgDiv, fullContent, fullReasoning || null);
                    } catch {}
                }
            }

            messages.push({ role: 'assistant', content: fullContent, reasoning_content: fullReasoning || undefined });
            updateStats();
            autoSave();

        } catch (e) {
            msgDiv.classList.remove('typing');
            const bubble = msgDiv.querySelector('.bubble');
            bubble.innerHTML = `<span style="color:#dc2626">❌ ${e.message}</span>`;
        }

        loading = false;
        document.getElementById('sendBtn').disabled = false;
    }

    function onKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    }

    document.getElementById('input').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    function newChat() {
        if (messages.length > 1 && !confirm('当前对话未保存，是否新建？')) return;
        messages = [{ role: 'system', content: config.system }];
        currentConvId = null;
        document.getElementById('messages').innerHTML = '<div class="empty-state">💬 新对话</div>';
        updateStats();
    }

    function autoSave() {
        if (messages.length <= 1) return;
        try {
            const data = { messages, config, params, time: Date.now(), id: currentConvId || Date.now().toString() };
            if (!currentConvId) currentConvId = data.id;
            const convs = getConvs();
            convs[data.id] = data;
            localStorage.setItem(CONV_KEY, JSON.stringify(convs));
        } catch {}
    }

    function getConvs() {
        try {
            const raw = localStorage.getItem(CONV_KEY);
            if (raw) return JSON.parse(raw);
        } catch {}
        return {};
    }

    function showConvList() {
        const convs = getConvs();
        const list = document.getElementById('convList');
        const ids = Object.keys(convs).sort((a, b) => (convs[b].time || 0) - (convs[a].time || 0));

        if (ids.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;">暂无保存的对话</div>';
        } else {
            list.innerHTML = ids.map(id => {
                const c = convs[id];
                const msgs = (c.messages || []).filter(m => m.role !== 'system');
                const first = msgs[0]?.content?.slice(0, 40) || '(空)';
                const t = c.time ? new Date(c.time).toLocaleString() : '';
                const active = id === currentConvId ? 'background:#eef2ff;' : '';
                return `<div class="conv-item" style="${active}" onclick="loadConv('${id}')">
                    <span class="conv-name">${escapeHtml(first)}${msgs.length > 1 ? '...' : ''}</span>
                    <span class="conv-meta">${msgs.length}条 ${t}</span>
                    <button class="conv-del" onclick="event.stopPropagation();deleteConv('${id}')" title="删除">✕</button>
                </div>`;
            }).join('');
        }
        showModal('convModal');
    }

    function loadConv(id) {
        const convs = getConvs();
        const c = convs[id];
        if (!c) return;
        messages = c.messages.map(m => ({ ...m }));
        config = c.config || config;
        params = c.params || params;
        currentConvId = id;
        hideModal('convModal');

        const container = document.getElementById('messages');
        container.innerHTML = '';
        let systemContent = '';
        for (let i = 0; i < messages.length; i++) {
            const m = messages[i];
            if (m.role === 'system') { systemContent = m.content; continue; }
            const div = addMsg(m.role, m.content, m.reasoning_content);
            div.dataset.idx = i;
        }
        if (!container.querySelector('.msg')) {
            container.innerHTML = '<div class="empty-state">💬 已加载对话</div>';
        }
        updateStats();
        toast('已加载对话');
    }

    function deleteConv(id) {
        if (!confirm('删除此对话？')) return;
        const convs = getConvs();
        delete convs[id];
        localStorage.setItem(CONV_KEY, JSON.stringify(convs));
        if (id === currentConvId) { currentConvId = null; }
        showConvList();
    }

    function copyMessages() {
        const msgs = messages.filter(m => m.role !== 'system');
        if (msgs.length === 0) { toast('没有可复制的消息'); return; }
        const text = JSON.stringify(msgs, null, 2);
        navigator.clipboard.writeText(text).then(
            () => toast('messages[] 已复制'),
            () => toast('复制失败')
        );
    }

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function marked(text) {
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/\n/g, '<br>');
    }
</script>
</body>
</html>
