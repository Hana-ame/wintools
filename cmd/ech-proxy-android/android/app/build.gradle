apply plugin: 'com.android.application'

android {
    namespace 'com.hanaame.twitterpic'
    compileSdk 34

    defaultConfig {
        applicationId "com.hanaame.twitterpic"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 签名配置（从环境变量读取，CI 使用 GitHub Secrets）
    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/release.keystore")
            storePassword "${System.getenv('KEYSTORE_PASSWORD') ?: 'android'}"
            keyAlias "${System.getenv('KEY_ALIAS') ?: 'release'}"
            keyPassword "${System.getenv('KEY_PASSWORD') ?: 'android'}"
            v1SigningEnabled true  // minSdk 21 需要 v1
            v2SigningEnabled true  // Android 7.0+
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.release  // 开发时使用 release 签名
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
