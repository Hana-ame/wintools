name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows]
        arch: [amd64, aarch64]
        exclude:
          - os: windows
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build all cmds (static, CGO off for old-glibc/Termux)
        run: |
          for cmd in cmd/*/; do
            name=$(basename "$cmd")
            # skip CGo shared library (needs C cross-compiler)
            [ "$name" = "ech-shared" ] && continue
            [ "$name" = "ech-proxy-android" ] && continue  # Android 单独构建
            ext=""
            [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
            mkdir -p "dist/${{ matrix.os }}/${{ matrix.arch }}"
            GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }} CGO_ENABLED=0 \
               go build -trimpath -ldflags="-s -w" \
               -o "dist/${{ matrix.os }}/${{ matrix.arch }}/${name}-${{ matrix.os }}-${{ matrix.arch }}${ext}" "./${cmd}"
          done
          # scripts/*.go 单文件工具（无 .go 时跳过, 目录可能已清空）
          for script in scripts/*.go; do
            [ -f "$script" ] || continue
            name=$(basename "$script" .go)
            ext=""
            [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
            mkdir -p "dist/${{ matrix.os }}/${{ matrix.arch }}"
            GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }} CGO_ENABLED=0 \
               go build -trimpath -ldflags="-s -w" \
               -o "dist/${{ matrix.os }}/${{ matrix.arch }}/${name}-${{ matrix.os }}-${{ matrix.arch }}${ext}" "./${script}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ matrix.os }}/${{ matrix.arch }}/

  # ech-shared 是 CGo 共享库, 需要本机 gcc, 单独在 Windows runner 上构建
  # (ubuntu 交叉编译需 mingw-w64, 直接用原生 runner 更稳)
  build-shared:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Setup MinGW gcc
        run: choco install mingw -y --no-progress
      - name: Build ech-shared DLL
        run: |
          go build -buildmode=c-shared -trimpath -ldflags="-s -w" `
            -o echshared.dll ./cmd/ech-shared
      - uses: actions/upload-artifact@v4
        with:
          name: vcshost.dll
          path: echshared.dll

  # Android APK 构建（Go c-shared + JNI wrapper + Java App）
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        run: |
          NDK_VERSION="r27"
          curl -L -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/
          echo "/tmp/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build ECH shared library (arm64)
        run: |
          cd cmd/ech-proxy-android
          CGO_ENABLED=1 \
          GOOS=android \
          GOARCH=arm64 \
          CC=aarch64-linux-android21-clang \
          go build -buildmode=c-shared -ldflags="-s -w" -o libechproxy.so .
          ls -lh libechproxy.so

      - name: Copy library to Android project
        run: |
          mkdir -p cmd/ech-proxy-android/android/app/src/main/jniLibs/arm64-v8a
          cp cmd/ech-proxy-android/libechproxy.so cmd/ech-proxy-android/android/app/src/main/jniLibs/arm64-v8a/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle 8.5
        run: |
          curl -L -o /tmp/gradle-8.5.zip "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
          unzip -q /tmp/gradle-8.5.zip -d /tmp/
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        run: |
          cd cmd/ech-proxy-android/android
          gradle wrapper --gradle-version 8.5

      - name: Build APK
        run: |
          cd cmd/ech-proxy-android/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: cmd/ech-proxy-android/android/app/build/outputs/apk/release/app-release.apk

  release:
    needs: [build, build-shared, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 每个 exe 的功能"
            cat RELEASE.md
            echo ""
            echo "## Android APK"
            echo "Twitter Pic Android 客户端，使用 ECH 代理访问 Twitter CDN。"
            echo "下载 app-release.apk 安装到手机。"
          } > release_body.md
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file release_body.md

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | while read -r f; do
            filename=$(basename "$f")
            label="${filename}"
            echo "Uploading: $label"
            gh release upload "${{ github.ref_name }}" "${f}#${label}" --clobber --repo "${{ github.repository }}"
          done
